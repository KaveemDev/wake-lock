<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="35%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Ambient Glow Radial Gradient -->
    <radialGradient id="ambientGlow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Icon Glow/Shadow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.3" />
    </filter>

    <!-- Icon Stroke Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)" />

  <!-- Ambient Glow Overlay -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#ambientGlow)" />

  <!-- Glass Inner Highlight Border -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6" />

  <!-- Scaled Alarm Clock Path from user SVG -->
  <g transform="translate(128, 128) scale(32)" filter="url(#iconGlow)">
    <path d="M5 3L2 6M22 6L19 3M6 19L4 21M18 19L20 21M12 9V13L14 15M12 21C14.1217 21 16.1566 20.1571 17.6569 18.6569C19.1571 17.1566 20 15.1217 20 13C20 10.8783 19.1571 8.84344 17.6569 7.34315C16.1566 5.84285 14.1217 5 12 5C9.87827 5 7.84344 5.84285 6.34315 7.34315C4.84285 8.84344 4 10.8783 4 13C4 15.1217 4.84285 17.1566 6.34315 18.6569C7.84344 20.1571 9.87827 21 12 21Z" 
          stroke="url(#iconGrad)" 
          stroke-width="2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>
</svg>
